<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A retro button masher boss fight game built with HTML, CSS, and vanilla JavaScript."
    />

    <title>Boss Fight Button Masher</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="boss-styles.css" />
  </head>
  <body>
    <main class="game-container" id="gameContainer">
      <section class="game-ui" id="gameUi" aria-labelledby="gameTitle">
        <p class="eyebrow">Retro Button Masher</p>
        <h1 class="game-title" id="gameTitle">Boss Fight</h1>

        <section class="boss-card" aria-label="Current boss fight">
          <div class="fight-header">
            <div>
              <h2 class="boss-name" id="bossName">Boss Name</h2>
              <p class="boss-dialogue" id="bossDialogue" aria-live="polite">
                Press attack. I dare you.
              </p>
            </div>

            <div class="run-panel" aria-label="Run progress">
              <span>Boss</span>
              <strong id="bossProgressText">1 / 5</strong>
            </div>
          </div>

          <div class="boss-stage" id="bossStage">
            <div class="boss-symbol" id="bossSymbol" aria-hidden="true">DL</div>
          </div>

          <div class="power-up-bar" aria-live="polite">
            <span id="powerUpText">Power-up: None</span>
          </div>

          <div class="hp-section">
            <div class="hp-label">
              <span>Boss HP</span>
              <span id="bossHpText">200 / 200</span>
            </div>
            <div class="hp-track" aria-hidden="true">
              <div class="hp-fill boss-hp-fill" id="bossHpFill"></div>
            </div>
          </div>

          <div class="hp-section">
            <div class="hp-label">
              <span>Player HP</span>
              <span id="playerHpText">100 / 100</span>
            </div>
            <div class="hp-track" aria-hidden="true">
              <div class="hp-fill player-hp-fill" id="playerHpFill"></div>
            </div>
          </div>

          <button class="attack-button" id="attackButton" type="button">
            Attack
          </button>

          <p class="hint-text">
            Press any keyboard key or tap the button to attack. Hold your rhythm
            and watch your HP.
          </p>
        </section>
      </section>

      <section class="result-card hidden" id="resultCard" aria-live="polite">
        <p class="eyebrow" id="resultEyebrow">Victory</p>
        <h2 class="result-title" id="resultTitle">Boss Defeated</h2>
        <p class="result-message" id="resultMessage">Message here.</p>
        <div class="result-stats" id="resultStats"></div>
        <button class="result-button" id="resultButton" type="button">
          Next Boss
        </button>
      </section>
    </main>

    <script src="boss-script.js"></script>
  </body>
</html>
